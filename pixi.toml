[workspace]
preview = ["pixi-build"]
authors = ["Mehmet Keçeci <enfo@tuta.io>"]
channels = ["https://prefix.dev/bilgi", "bilgi", "pypi", "https://prefix.dev/conda-forge", "https://conda.modular.com/max-nightly", "conda-forge", "https://repo.prefix.dev/modular-community"]
platforms = ["linux-64"]
name = "adnus"
version = "0.2.3"

[package]
name = "adnus"
version = "0.2.3"
license = "AGPL-3.0-or-later"

[dependencies]
python = ">=3.11"
pip = ">=25.3"
conda-build = ">=25.11.1"
setuptools = ">=80.10.1"
wheel = ">=0.45.1"
hatchling = ">=1.28.0"
setuptools_scm = ">=9.2.2"
rattler-build = ">=0.55.0"
pytest = "*"

[tasks]
build = "python -m build"
start = "python -c 'import adnus; print(adnus.__version__)'"
lint = "ruff check ."
fmt = "ruff format ."
serve = { cmd = "python -m http.server", cwd = "docs" }
install-adnus = "pip install git+https://github.com/WhiteSymmetry/adnus"
install = "pip install -e ."
test = { depends-on = ["install"], cmd = "pytest" }

[package.build.backend]
name = "pixi-build-python"
version = "*"

[package.host-dependencies]
python = ">=3.11"
setuptools = ">=84.0.0"
pip = "*"
