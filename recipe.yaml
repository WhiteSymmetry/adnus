# recipe-noarch-python.yaml
schema_version: 1

# this sets up "context variables" (in this case name and version) that
# can later be used in Jinja expressions
context:
  version: 0.2.3
  name: adnus

# top level package information (name and version)
package:
  name: adnus
  version: 0.2.3

# location to get the source from
#`source` are `url`, `sha256`, `md5`, `patches`, `file_name` and `target_directory`
source:
  url: https://files.pythonhosted.org/packages/15/63/290bce187fbb64325d9834307d3354e2407e0be85681dbce5eac98532754/adnus-0.2.3.tar.gz
  sha256: ae734a1f3747e831c825843ac1021b7f5ef9daea868df1d2708760b6ddfeceb6

# build number (should be incremented if a new build is made, but version is not incrementing)
build:
  number: 1
  script: python -m pip install --no-deps --ignore-installed .
  noarch: python

# the requirements at build and runtime
requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
    - numpy
  run:
   - python >=3.11  # hypercomplex uyumlu versiyon
   - numpy  # adnus numpy kullanıyor

# tests to validate that the package works as expected
#tests:
#  requires: []  # veya boş liste
#  - python:
#      imports:
#        - adnus

# information about the package
about:
  homepage: https://github.com/WhiteSymmetry/adnus/
  license: AGPL-3.0-or-later
  summary: 'adnus'
  description: |
    adnus
  repository: https://github.com/WhiteSymmetry/adnus/
  documentation: https://github.com/WhiteSymmetry/adnus/

# the below is conda-forge specific!
extra:
  recipe-maintainers:
    - bilgi
