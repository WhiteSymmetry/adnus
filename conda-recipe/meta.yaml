{% set version = "0.2.3" %}

package:
  name: adnus
  version: "{{ version }}"

source:
  path: ..

build:
  noarch: python
  number: 0
  script: |
    echo "SRC_DIR=$SRC_DIR"
    test -f "$SRC_DIR/pyproject.toml"
    test -f "$SRC_DIR/adnus/__init__.py"

    {{ PYTHON }} -m pip install "$SRC_DIR" --no-deps --ignore-installed -vv

    echo "Kurulumdan sonra adnus dosyaları:"
    find "$SP_DIR" -maxdepth 3 -path '*adnus*' -print

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=77.0
    - wheel
    - setuptools_scm >=6.2
  run:
    - python >=3.11
    - numpy >=2.3.3

test:
  imports:
    - adnus

about:
  home: https://github.com/WhiteSymmetry/adnus
  license: AGPL-3.0-or-later
  license_file: LICENSE
  summary: "adnus (AdNuS): Advanced Number Systems"
