{% set version = "0.2.3" %}

package:
  name: adnus
  version: "{{ version }}"

source:
  path: ..

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools >=77.0
    - wheel
    - setuptools_scm >=6.2
  run:
    - python >=3.11
    - numpy >=2.3.3

test:
  imports:
    - adnus

about:
  home: https://github.com/WhiteSymmetry/adnus
  license: AGPL-3.0-or-later
  license_file: ../LICENSE
  summary: "adnus (AdNuS): Advanced Number Systems"
  description: |
    adnus (AdNuS): Advanced Number Systems, including Bicomplex,
    Neutrosophic, Hyperreal, Complex, Quaternion, Octonion,
    Sedenion, Pathion, Chingon, Routon, and Voudon.
  dev_url: https://github.com/WhiteSymmetry/adnus
  doc_url: https://github.com/WhiteSymmetry/adnus
